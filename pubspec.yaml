name: android_native_path
description: "`android_native_path` is a lightweight Flutter plugin that provides access to the application's native library directory and the native libraries stored inside it on Android."
version: 0.2.0

repository: https://github.com/ThanCoder/android_native_path.git
homepage: https://pub.dev/packages/android_native_path

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: com.example.android_native_path
        pluginClass: AndroidNativePathPlugin
