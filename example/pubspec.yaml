name: android_native_path_example
description: "Demonstrates how to use the android_native_path plugin."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter

  android_native_path:
    path: ../
  cupertino_icons: ^2.0.0
  dart_core_extensions: ^0.8.0
  material_ui: ^1.11.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
